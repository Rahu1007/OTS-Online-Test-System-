{% extends 'main.html' %}
{% load static %}

{% block title %}
OTS-Login Form
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}



{% block content %}
<div class="all-forms">
    <h2>Login</h2>
    {% if loginError %}
    <div id="error">{{ loginError }}</div>
    {% endif %}
    <form action="{% url 'OTS:login' %}" method="POST">
        {% csrf_token %}
        <div class="form-unit">
            <label for="username">Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-unit">
            <label for="password">Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-unit">
            <input type="submit" value="Login">
            <input type="reset" value="Clear">
        </div>
    </form>
    <p>New user? <a href="{% url 'OTS:registrationForm' %}">Click here</a></p>
</div>
{% endblock %}
